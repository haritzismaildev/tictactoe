<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .status {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            min-height: 40px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            margin: 0 auto 30px;
            width: fit-content;
        }

        .cell {
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
        }

        .cell:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        .cell.winning {
            background: #ffd700;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .reset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(102, 126, 234, 0.6);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .score {
            font-size: 1.2em;
            color: #333;
        }

        .score span {
            font-weight: bold;
            font-size: 1.5em;
        }

        .score.x span {
            color: #667eea;
        }

        .score.o span {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tic Tac Toe</h1>
        
        <div class="score-board">
            <div class="score x">
                Pemain X: <span id="scoreX">0</span>
            </div>
            <div class="score o">
                Pemain O: <span id="scoreO">0</span>
            </div>
        </div>

        <div class="status" id="status">Giliran Pemain X</div>
        
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        
        <button class="reset-btn" id="resetBtn">Main Lagi</button>
    </div>

    <script>
        // Variabel game
        let currentPlayer = 'X';
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;
        let scoreX = 0;
        let scoreO = 0;

        // Pola kemenangan
        const winPatterns = [
            [0, 1, 2], // Baris atas
            [3, 4, 5], // Baris tengah
            [6, 7, 8], // Baris bawah
            [0, 3, 6], // Kolom kiri
            [1, 4, 7], // Kolom tengah
            [2, 5, 8], // Kolom kanan
            [0, 4, 8], // Diagonal kiri-kanan
            [2, 4, 6]  // Diagonal kanan-kiri
        ];

        // Ambil elemen DOM
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const scoreXElement = document.getElementById('scoreX');
        const scoreOElement = document.getElementById('scoreO');

        // Event listeners
        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        resetBtn.addEventListener('click', resetGame);

        // Fungsi handle klik sel
        function handleCellClick(e) {
            const index = e.target.dataset.index;

            if (gameBoard[index] !== '' || !gameActive) {
                return;
            }

            updateCell(e.target, index);
            checkResult();
        }

        // Update sel
        function updateCell(cell, index) {
            gameBoard[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());
        }

        // Cek hasil
        function checkResult() {
            let roundWon = false;
            let winningPattern = null;

            for (let i = 0; i < winPatterns.length; i++) {
                const pattern = winPatterns[i];
                const a = gameBoard[pattern[0]];
                const b = gameBoard[pattern[1]];
                const c = gameBoard[pattern[2]];

                if (a === '' || b === '' || c === '') {
                    continue;
                }

                if (a === b && b === c) {
                    roundWon = true;
                    winningPattern = pattern;
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `🎉 Pemain ${currentPlayer} Menang!`;
                gameActive = false;
                highlightWinningCells(winningPattern);
                updateScore();
                return;
            }

            // Cek seri
            if (!gameBoard.includes('')) {
                statusText.textContent = '🤝 Permainan Seri!';
                gameActive = false;
                return;
            }

            // Ganti pemain
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusText.textContent = `Giliran Pemain ${currentPlayer}`;
        }

        // Highlight sel pemenang
        function highlightWinningCells(pattern) {
            pattern.forEach(index => {
                cells[index].classList.add('winning');
            });
        }

        // Update skor
        function updateScore() {
            if (currentPlayer === 'X') {
                scoreX++;
                scoreXElement.textContent = scoreX;
            } else {
                scoreO++;
                scoreOElement.textContent = scoreO;
            }
        }

        // Reset game
        function resetGame() {
            currentPlayer = 'X';
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            statusText.textContent = 'Giliran Pemain X';

            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o', 'winning');
            });
        }
    </script>
</body>
</html>
